<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pokémon Counter</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pokémon Counter">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161f">
<style>
:root{--bg:#14161f;--card:#1e212d;--line:#2d3142;--tx:#eef0f6;--sub:#9aa0b4;--ac:#ffcb05;--red:#ee4d4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:6px 0 2px;letter-spacing:.5px}
h1 span{color:var(--ac)}
.sub{color:var(--sub);font-size:13px;margin:0 0 14px}
#install{display:none;width:100%;margin:0 0 12px;padding:11px 14px;border-radius:10px;border:1px solid var(--line,#2a2e3d);background:#e84a4a;color:#fff;font:700 14px/1.2 inherit;cursor:pointer}
#install.show{display:block}
#iosHint{display:none;margin:0 0 12px;padding:10px 12px;border-radius:10px;border:1px dashed #3a3f55;font-size:12.5px;color:var(--sub)}
#iosHint.show{display:block}
input[type=search],input[type=text]{width:100%;font-size:17px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--tx);outline:none}
input:focus{border-color:var(--ac)}
.sug{margin-top:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sug button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 12px;background:none;border:0;border-bottom:1px solid var(--line);color:var(--tx);font-size:15px;text-align:left}
.sug button:last-child{border-bottom:0}
.sug img{width:40px;height:40px}
.num{color:var(--sub);font-size:12px;width:44px}
.tb{display:inline-block;color:#fff;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;margin-right:4px;text-shadow:0 1px 1px #0005}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-top:14px}
.target{display:flex;align-items:center;gap:12px}
.target img{width:96px;height:96px}
.target h2{margin:0 0 6px;font-size:22px}
.target .en{color:var(--sub);font-size:12px}
.row{display:flex;align-items:center;gap:8px;margin:8px 0;flex-wrap:wrap}
.row b{font-size:13px;color:var(--sub);width:44px}
h3{margin:0 0 8px;font-size:15px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:4px 0 8px}
.item{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item img{width:52px;height:52px}
.item .nm{font-weight:600}
.item .mid{flex:1;min-width:0}
.meta{font-size:12px;color:var(--sub);margin-top:3px}
.good{color:#5fd68a}.bad{color:var(--red)}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font-size:16px;font-weight:700;padding:14px;border-radius:12px;border:0;margin-top:10px;color:#111;background:var(--ac)}
.btn.sec{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.small{font-size:12px;color:var(--sub);margin-top:10px;line-height:1.5}
.hide{display:none}
.msg{color:var(--sub);text-align:center;padding:24px 8px;font-size:14px}

.row b{width:auto;min-width:44px}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin-top:10px}
.seg button{flex:1;padding:9px 6px;border:0;border-radius:8px;background:none;color:var(--sub);font-size:13px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--ac);color:#12141c}
details.card summary{cursor:pointer;font-weight:700;font-size:15px}
.sub2{color:var(--sub);font-weight:400}
textarea{width:100%;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx);margin-top:4px;font-family:inherit;resize:vertical}
.ownlist{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.oc{display:inline-flex;align-items:center;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 4px 2px 6px;font-size:13px}
.oc img{width:28px;height:28px}
.oc button{border:0;background:none;color:var(--sub);font-size:14px;padding:4px 6px}
.item.dim{opacity:.62}
.rh{display:flex;gap:10px;align-items:center}.rh img{width:72px;height:72px}.rm{min-width:0;flex:1}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;margin-right:6px;background:var(--line);color:var(--tx)}
.t-5{background:#7a4cc2}.t-mega{background:#d4572b}.t-smega{background:#b03a8e}.t-shadow{background:#4a4f70}.t-max{background:#2b8aa8}
.st-live{background:#2f9e5a;color:#fff}.st-soon{background:#c9951a;color:#111}.st-ended{background:#555}
.rc.ended{opacity:.6}.btns{display:flex;gap:8px}.btns .btn{margin-top:8px}
.seg.wx{flex-wrap:wrap}.seg.wx button{flex:1 0 22%}
.two{display:flex;gap:8px}.two>div{flex:1;min-width:0}
select,input[type=date]{width:100%;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--tx)}
#tabSeg{margin:0 0 12px}
</style>
</head>
<body>
<div class="wrap">
<div class="seg" id="tabSeg" role="group" aria-label="화면"><button type="button" data-tab="1" aria-pressed="true">카운터</button><button type="button" data-tab="2" aria-pressed="false">레이드 준비</button></div>

<section id="tab1">
  <h1>⚡ POKÉ <span>COUNTER</span></h1>
  <p class="sub">상대 포켓몬 이름을 입력하면, 약점을 찌르는 카운터를 찾아줘요.</p>
  <button type="button" id="install">📲 홈 화면에 앱으로 설치</button>
  <div id="iosHint">안드로이드 크롬 메뉴(⋮)에서 <b>홈 화면에 추가</b> 또는 <b>앱 설치</b>를 눌러도 돼요. 아이폰은 공유 버튼 → <b>홈 화면에 추가</b>예요.</div>
  <input id="q" type="search" placeholder="예: 피카츄, 팬텀, 망나뇽, 뮤츠" autocomplete="off" autocapitalize="off">
  <div id="sug" class="sug hide"></div>
  <div id="status" class="msg">도감 불러오는 중…</div>
  <div class="seg" id="modeSeg" role="group" aria-label="상성 배율">
    <button type="button" data-go="0" aria-pressed="true">본편 배율</button>
    <button type="button" data-go="1" aria-pressed="false">포켓몬 GO 배율</button>
  </div>
  <details id="ownBox" class="card">
    <summary>내 포켓몬 <span class="sub2">(<span id="ownCount">0</span>마리)</span></summary>
    <p class="small">포켓몬 GO는 보유 목록을 외부 앱에 제공하지 않아서 자동으로 읽어올 수 없어요. 아래에서 직접 추가하세요. 목록은 이 기기의 브라우저에만 저장돼요.</p>
    <input id="ownQ" type="search" placeholder="추가할 포켓몬 이름 (예: 팬텀)" autocomplete="off" autocapitalize="off">
    <div id="ownSug" class="sug hide"></div>
    <div id="ownList" class="ownlist"></div>
    <label class="small" for="bulk">여러 마리 한 번에 추가 (줄바꿈이나 쉼표로 구분)</label>
    <textarea id="bulk" rows="3" placeholder="예: 피카츄, 팬텀, 망나뇽"></textarea>
    <button type="button" class="btn" id="bulkAdd">붙여넣은 목록 추가</button>
    <div id="bulkMsg" class="small" role="status"></div>
    <button type="button" class="btn sec" id="ownClear">내 포켓몬 모두 지우기</button>
  </details>
  <div id="result"></div>
</section>

<section id="tab2" class="hide"><h1>🗓️ 레이드 <span>준비</span></h1><div id="raidBox"></div></section>

</div>

<script src="app.js"></script>
</body>
</html>
